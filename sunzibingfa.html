</script>

<script>
    // ==========================================
    // 🌟 圖片網址對照表 🌟
    // 請將雙引號內的內容，替換成您從新華網複製的圖片網址
    // ==========================================
    const IMAGE_LINKS = {
        "主帥帳": "", // 這裡可以放入您原本 Gemini 生成的主帥帳圖片連結
        "勝戰計": "", // 這裡可以放入您原本 Gemini 生成的勝戰計圖片連結
        "敵戰計": "", // 這裡可以放入您原本 Gemini 生成的敵戰計圖片連結
        "以逸待勞": "", 
        "借刀殺人": "",
        "圍魏救趙": "",
        "瞞天過海": "",
        "趁火打劫": "",
        "聲東擊西": "",
        "無中生有": "",
        "暗渡陳倉": "",
        "隔岸觀火": "",
        "笑裡藏刀": "",
        "李代桃僵": "",
        "順手牽羊": "",
        // 如果上面沒有填寫網址，會自動顯示這張預設圖片提示您：
        "default": "https://via.placeholder.com/600x300/fdf5e6/8b0000?text=圖片請至新華網複製連結並於程式碼中替換"
    };

    // --- 以下為遊戲引擎核心，不需修改 ---
    const passages = {};
    let isAudioPlaying = false;

    function initGame() {
        let rawData = document.getElementById('twee-data').textContent;
        const blocks = rawData.split(/^::\s+(.+)$/gm);
        
        for(let i = 1; i < blocks.length; i += 2) {
            let name = blocks[i].trim().replace(/\s*\{.*\}\s*$/, '');
            let content = blocks[i+1];
            
            // 移除 Twine 語法雜質
            content = content.replace(/\\::\s*.*$/gm, '');
            content = content.replace(/^\{\s*$/gm, '');
            content = content.replace(/^\}\s*$/gm, '');
            content = content.replace(/<audio.*?>.*?<\/audio>/g, '');
            
            passages[name] = content.trim();
        }
        goTo('start');
    }

    function parseContent(text) {
        let html = text;
        
        // 1. 解析段落跳轉 [[文字->目標]] 與 [[目標]]
        html = html.replace(/\[\[(.*?)->(.*?)\]\]/g, '<div class="nav-wrapper"><a href="javascript:void(0)" class="nav-link" onclick="goTo(\'$2\')">▶ $1</a></div>');
        html = html.replace(/\[\[(.*?)\]\]/g, '<div class="nav-wrapper"><a href="javascript:void(0)" class="nav-link" onclick="goTo(\'$1\')">▶ $1</a></div>');
        
        // 2. 解析互動選擇題 (link: "文字")[ (text-color:#顏色)[內容] ]
        const linkRegex = /\(link:\s*"([^"]+)"\)\[\s*\(text-color:\s*(#[0-9a-fA-F]+)\)\[([\s\S]*?)\]\s*\]/g;
        html = html.replace(linkRegex, function(match, btnText, color, innerText) {
            return `<div style="margin-top: 10px;">
                      <a href="javascript:void(0)" class="choice-btn" onclick="this.nextElementSibling.style.display='block'; this.style.display='none'; playAudioIfNotPlaying();">✏️ ${btnText.replace(/【✏️ 點擊作答：|】/g, '')}</a>
                      <div class="feedback-box" style="border-left: 5px solid ${color}; color: ${color};">${innerText.trim()}</div>
                    </div>`;
        });

        // 3. 解析圖片替換
        html = html.replace(/<img src="file:\/\/\/.*?\/([^/]+?)(?:\.[a-zA-Z]+)"[^>]*>/g, function(match, encodedName) {
            let key = decodeURIComponent(encodedName);
            
            // 處理原本由 Gemini 生成的特定圖片名稱
            if(key.includes("Gemini_Generated")) {
                if(key.includes("cxho")) key = "主帥帳";
                else if(key.includes("fze4")) key = "勝戰計";
                else if(key.includes("m0lr")) key = "敵戰計";
                else key = "default";
            }
            
            let src = (IMAGE_LINKS[key] && IMAGE_LINKS[key].startsWith('http')) ? IMAGE_LINKS[key] : IMAGE_LINKS['default'];
            return `<img class="scene-img" src="${src}">`;
        });

        // 4. 解析斷行
        html = html.replace(/\n/g, '<br>');
        
        return html;
    }

    function goTo(passageName) {
        const container = document.getElementById('game-container');
        if(passages[passageName]) {
            container.innerHTML = parseContent(passages[passageName]);
            window.scrollTo({ top: 0, behavior: 'smooth' });
            playAudioIfNotPlaying();
        } else {
            container.innerHTML = "<h2 style='color:#8b0000;'>兵法卷宗遺失 (找不到段落: " + passageName + ")</h2>";
        }
    }

    function toggleAudio() {
        const bgm = document.getElementById('bgm');
        if(bgm.paused) {
            bgm.play();
            isAudioPlaying = true;
        } else {
            bgm.pause();
            isAudioPlaying = false;
        }
    }

    function playAudioIfNotPlaying() {
        const bgm = document.getElementById('bgm');
        // 現代瀏覽器需要使用者互動後才能播放音樂
        if(bgm.paused && !isAudioPlaying) {
            bgm.play().then(() => { isAudioPlaying = true; }).catch(e => { console.log("等待使用者互動以播放音樂"); });
        }
    }

    window.onload = initGame;
</script>
