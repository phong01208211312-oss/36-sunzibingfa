:: 以逸待勞 
\:: 第04計 以逸待勞
<div style="text-align: center">
<img src="file:///Users/phongnghi/Downloads/%E4%BB%A5%E9%80%B8%E5%BE%85%E5%8B%9E.jpg" width="80%">
</div>
袁老師從容地將一面軍旗插在險要的高地上：「『以逸待勞』，是指在戰爭中做好充分準備，養精蓄銳，等疲憊的敵人長途跋涉來犯時，再給予迎頭痛擊。」
【📝 生詞學習】
* 逸 (yì)：安閒、休息。
* 勞 (láo)：疲倦、辛勞。
【💬 現代情境對話】
「準備華語檢定（TOCFL）前一天，與其熬夜苦讀，不如好好睡一覺，『以逸待勞』，明天才能發揮最好的實力。」
袁老師問：「如果我們主動出擊，連夜奔襲敵軍的營地，這是以逸待勞嗎？」
(link: "【✏️ 點擊作答：是】")[
(text-color:#8b0000)[袁老師引導道：「請注意『逸』的含義。若我軍連夜奔襲，疲勞的將是我方，這反而會落入敵人設下的陷阱，讓對方得以『以逸待勞』了。」]
]
(link: "【✏️ 點擊作答：不是】")[
(text-color:#d4af37)[袁老師微笑著說：「很好！以逸待勞的關鍵在於『不動如山』，保留體力讓對手去消耗。」]
]

    function startGame() {

        if(wantMusic) {
            const bgm = document.getElementById('bgm');

    // 2. Twee 資料解析
    function initTweeData() {
        let rawData = document.getElementById('twee-data').textContent;
        const blocks = rawData.split(/^::\s+(.+)$/gm);
        
        for(let i = 1; i < blocks.length; i += 2) {
            let name = blocks[i].trim().replace(/\s*\{.*\}\s*$/, '');
            let content = blocks[i+1];
            content = content.replace(/\\::\s*.*$/gm, '').replace(/^\{\s*$/gm, '').replace(/^\}\s*$/gm, '');
            passages[name] = content.trim();
        }
        goTo('start');
    }

    // 3. 解析器
    function parseContent(text, currentPassageName) {
        let html = text;
        
        // 處理跳轉按鈕 (加上 visited-link 邏輯)
        html = html.replace(/\[\[(.*?)->(.*?)\]\]/g, function(match, label, target) {
            let extraClass = gameState.visited.includes(target) ? ' visited-link' : '';
            return `<div class="nav-wrapper"><a href="javascript:void(0)" class="nav-link${extraClass}" onclick="goTo('${target}')">▶ ${label}</a></div>`;
        });
        html = html.replace(/\[\[(.*?)\]\]/g, function(match, target) {
            let extraClass = gameState.visited.includes(target) ? ' visited-link' : '';
            return `<div class="nav-wrapper"><a href="javascript:void(0)" class="nav-link${extraClass}" onclick="goTo('${target}')">▶ ${target}</a></div>`;
        });
        
        // 選項按鈕與計分判斷
        const linkRegex = /\(link:\s*"([^"]+)"\)\[\s*\(text-color:\s*(#[0-9a-fA-F]+)\)\[([\s\S]*?)\]\s*\]/g;
        
        if (gameState.answered[currentPassageName]) {
            // 如果此題已經回答過，隱藏按鈕，只顯示正確的回饋當作複習
            html = html.replace(linkRegex, function(match, btnText, color, innerText) {
                if (color.toLowerCase() === '#d4af37') { // 只擷取金色(正確)的回饋
                     return `<div class="feedback-box" style="display:block; margin-top: 20px; border-left: 5px solid ${color}; color: ${color};">💡 兵法重點複習：<br>${innerText.trim()}</div>`;
                }
                return ""; 
            });
            html += `<div style="margin-top:20px; padding:10px; background:#e8e8e8; border-radius:8px; color:#555; text-align:center; font-weight:bold;">✅ 此計謀已演練完畢，得分已入帳。</div>`;
        } else {
            // 還沒回答過，正常渲染選擇按鈕
            html = html.replace(linkRegex, function(match, btnText, color, innerText) {
                let isCorrect = (color.toLowerCase() === '#d4af37');
                return `<div style="margin-top: 10px;">
                          <a href="javascript:void(0)" class="choice-btn" onclick="handleChoice(this, ${isCorrect}, '${currentPassageName}')">✏️ ${btnText.replace(/【✏️ 點擊作答：|】/g, '')}</a>
                          <div class="feedback-box" style="border-left: 5px solid ${color}; color: ${color};">${innerText.trim()}</div>
                        </div>`;
            });
        }

        // 圖片替換
        html = html.replace(/<img src="file:\/\/\/.*?\/([^/]+?)(?:\.[a-zA-Z]+)"[^>]*>/g, function(match, encodedName) {
            let key = decodeURIComponent(encodedName);
            if(key.includes("Gemini_Generated")) {
                if(key.includes("cxho")) key = "主帥帳";
                else if(key.includes("fze4")) key = "勝戰計";
                else if(key.includes("m0lr")) key = "敵戰計";
                else key = "default";
            }
            let src = (IMAGE_LINKS[key] && IMAGE_LINKS[key].startsWith('http')) ? IMAGE_LINKS[key] : IMAGE_LINKS['default'];
            return `<img class="scene-img" src="${src}">`;
        });

        return html.replace(/\n/g, '<br>');
    }

    function goTo(passageName) {
        if (!gameState.visited.includes(passageName)) {
            gameState.visited.push(passageName);
        }
        
        const container = document.getElementById('game-container');
        if(passages[passageName]) {
            container.innerHTML = parseContent(passages[passageName], passageName);
            
            // 檢查是否符合【測驗觸發條件】
            if (SET_STRATAGEMS[passageName]) {
                let allVisited = SET_STRATAGEMS[passageName].every(p => gameState.visited.includes(p));
                if (allVisited && !gameState.quizPassed[passageName]) {
                    container.innerHTML += `<div style="margin-top:40px; text-align:center;"><button class="btn" style="width:80%; background-color:#d4af37; color:#222; font-size:1.2em;" onclick="startQuiz('${passageName}')">📝 進行本套兵法總結測驗 (C1-C2等級)</button></div>`;
                } else if (allVisited && gameState.quizPassed[passageName]) {
                    container.innerHTML += `<div style="margin-top:30px; text-align:center; color:#8b0000; font-weight:bold; font-size:1.2em; background:#fdf5e6; padding:10px; border-radius:8px;">🏆 您已成功通過【${passageName}】高階綜合演練！</div>`;
                }
            }
            
            window.scrollTo({ top: 0, behavior: 'smooth' });
        } else {
            container.innerHTML = "<h2 style='color:#8b0000;'>兵法卷宗遺失 (找不到段落)</h2>";
        }
    }

    // 4. 一般答題處理與連擊計分
    window.handleChoice = function(btn, isCorrect, passageName) {
        let allBtns = btn.parentElement.parentElement.querySelectorAll('.choice-btn');
        allBtns.forEach(b => {
            b.style.pointerEvents = 'none';
            if (b !== btn) b.style.opacity = '0.4';
        });

        btn.style.display = 'none';
        btn.nextElementSibling.style.display = 'block'; // 顯示引導回饋
        gameState.answered[passageName] = true; // 標記為已答過
        
        if (isCorrect) {
            comboCount++;
            let earnedScore = comboCount * 100;
            currentScore += earnedScore;
            document.getElementById('hud-score').innerText = currentScore;
            
            let comboUI = document.getElementById('hud-combo');
            comboUI.innerText = comboCount > 1 ? `🔥 ${comboCount} 連擊！(+${earnedScore})` : `✅ 答對 (+100)`;
            comboUI.style.animation = 'none';
            comboUI.offsetHeight; /* trigger reflow */
            comboUI.style.animation = 'pop 0.3s ease-out';
            
            saveScore();
        } else {
            comboCount = 0;
            let comboUI = document.getElementById('hud-combo');
            comboUI.innerText = `❌ 連擊中斷`;
            comboUI.style.color = '#8b0000';
            setTimeout(() => { comboUI.style.color = '#ff8c00'; comboUI.innerText = ''; }, 1500);
        }
    };

    // --- 測驗系統 (高階填空) ---
    let currentQuizQuestions = [];
    let currentQIndex = 0;
    let attemptsLeft = 3;
    let currentQuizSetName = "";

    window.startQuiz = function(setName) {
        currentQuizSetName = setName;
        currentQuizQuestions = QUIZ_DATA[setName];
        currentQIndex = 0;
        
        document.getElementById('overlay').style.display = 'block';
        document.getElementById('quiz-modal').style.display = 'block';
        loadQuizQuestion();
    };

    function loadQuizQuestion() {
        if(currentQIndex >= currentQuizQuestions.length) {
            // 測驗結束
            document.getElementById('quiz-question').innerHTML = "🎉 恭喜完成本套兵法綜合測驗！";
            document.getElementById('quiz-input').style.display = 'none';
            document.getElementById('quiz-feedback').innerHTML = "";
            document.getElementById('quiz-progress').innerText = "";
            let btn = document.getElementById('quiz-btn');
            btn.innerText = "關閉並返回";
            btn.onclick = closeQuizAndComplete;
            return;
        }
        
        attemptsLeft = 3;
        let q = currentQuizQuestions[currentQIndex];
        document.getElementById('quiz-title').innerText = `【綜合演練】${currentQuizSetName}`;
        document.getElementById('quiz-progress').innerText = `第 ${currentQIndex + 1} / 6 題 (剩餘機會: ${attemptsLeft} 次)`;
        document.getElementById('quiz-question').innerText = q.q;
        
        let inputField = document.getElementById('quiz-input');
        inputField.value = "";
        inputField.style.display = 'inline-block';
        inputField.disabled = false;
        setTimeout(() => inputField.focus(), 100);
        
        document.getElementById('quiz-feedback').innerText = "";
        
        let btn = document.getElementById('quiz-btn');
        btn.innerText = "送出答案";
        btn.onclick = checkQuizAnswer;
    }

    window.checkQuizAnswer = function() {
        let inputField = document.getElementById('quiz-input');
        let input = inputField.value.trim();
        if(!input) return;
        
        let q = currentQuizQuestions[currentQIndex];
        let feedback = document.getElementById('quiz-feedback');
        let btn = document.getElementById('quiz-btn');
        
        if(input === q.a) {
            // 測驗答對也算連擊
            comboCount++;
            let earnedScore = comboCount * 100;
            currentScore += earnedScore;
            document.getElementById('hud-score').innerText = currentScore;
            saveScore();
            
            feedback.style.color = "green";
            feedback.innerHTML = `✅ 答對了！(+${earnedScore}分)<br><span style="font-size:0.85em;color:#555;font-weight:normal;">${q.exp}</span>`;
            inputField.disabled = true;
            btn.innerText = "下一題";
            btn.onclick = () => { currentQIndex++; loadQuizQuestion(); };
        } else {
            attemptsLeft--;
            comboCount = 0; // 答錯中斷連擊
            
            if(attemptsLeft > 0) {
                feedback.style.color = "red";
                feedback.innerText = `❌ 答錯了。剩餘機會：${attemptsLeft} 次`;
                document.getElementById('quiz-progress').innerText = `第 ${currentQIndex + 1} / 6 題 (剩餘機會: ${attemptsLeft} 次)`;
                inputField.value = "";
                inputField.focus();
            } else {
                feedback.style.color = "#8b0000";
                feedback.innerHTML = `❌ 3次機會用盡。正確答案是：【${q.a}】。<br><span style="font-size:0.85em;color:#555;font-weight:normal;">${q.exp}</span>`;
                inputField.disabled = true;
                btn.innerText = "下一題";
                btn.onclick = () => { currentQIndex++; loadQuizQuestion(); };
            }
        }
    };

    function closeQuizAndComplete() {
        document.getElementById('overlay').style.display = 'none';
        document.getElementById('quiz-modal').style.display = 'none';
        gameState.quizPassed[currentQuizSetName] = true;
        goTo(currentQuizSetName); // 重新渲染該頁面以顯示通過訊息
    }

    // 5. 排行榜系統 (LocalStorage)
    function saveScore() {
        let lb = JSON.parse(localStorage.getItem('36_leaderboard')) || {};
        if (!lb[currentPlayer] || currentScore > lb[currentPlayer]) {
            lb[currentPlayer] = currentScore;
        }
        localStorage.setItem('36_leaderboard', JSON.stringify(lb));
    }

    window.showLeaderboard = function() {
        let lb = JSON.parse(localStorage.getItem('36_leaderboard')) || {};
        let sorted = Object.keys(lb).sort((a, b) => lb[b] - lb[a]);
        
        let listHTML = '';
        if(sorted.length === 0) {
            listHTML = '<li><span>尚無主帥留下戰績</span></li>';
        } else {
            for(let name of sorted) {
                listHTML += `<li><span>${name}</span> <span><b style="color:#d4af37">${lb[name]}</b> 分</span></li>`;
            }
        }
        
        document.getElementById('leaderboard-list').innerHTML = listHTML;
        document.getElementById('leaderboard-modal').style.display = 'block';
        document.getElementById('overlay').style.display = 'block';
    }

    window.closeModals = function() {
        document.getElementById('leaderboard-modal').style.display = 'none';
        // 如果測驗正在進行中，不允許點擊背景關閉
        if(document.getElementById('quiz-modal').style.display === 'block') return;
        document.getElementById('overlay').style.display = 'none';
    }

    // 6. 全局音樂控制
    window.toggleAudio = function() {
        const bgm = document.getElementById('bgm');
        if(bgm.paused) {
            bgm.play();
            isAudioPlaying = true;
            updateAudioUI(true);
        } else {
            bgm.pause();
            isAudioPlaying = false;
            updateAudioUI(false);
        }
    }
    
    function updateAudioUI(isPlaying) {
        const btn = document.getElementById('audio-btn');
        const icon = document.getElementById('audio-icon');
        const text = document.getElementById('audio-text');
        
        if(isPlaying) {
            btn.classList.add('playing');
            icon.innerText = '🔊';
            text.innerText = '音樂: 開啟';
        } else {
            btn.classList.remove('playing');
            icon.innerText = '🔇';
            text.innerText = '音樂: 關閉';
        }
    }
</script>
</body>
</html>
